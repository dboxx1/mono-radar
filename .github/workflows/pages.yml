name: Publish Mono Radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # refresh airport weather (METAR) every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons .nojekyll _site/
          python3 scripts/build_metars.py index.html _site/metars.json || echo '{"t":0,"m":{}}' > _site/metars.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
